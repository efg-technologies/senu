[package]
name = "senu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Experimental Rust seed that serves HTML, a JSON API and MCP from one operation layer"
license = "Apache-2.0"
repository = "https://github.com/efg-technologies/senu"
readme = "README.md"
publish = false

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["config", "derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
form_urlencoded = "1.2.2"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = { version = "2.6.1", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["net", "rt"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
