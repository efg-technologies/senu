name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy, the library without the demo
        run: |
          cargo clippy --locked --no-default-features --lib -- -D warnings
          cargo clippy --locked --no-default-features --features contract --lib -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Python for the quickstart checker and its tests
        run: python3 --version
      - name: Test
        run: cargo test --locked -- --test-threads=2
      - name: Quickstart
        run: scripts/quickstart.sh
      - name: The package holds only the intended files and builds from them
        run: |
          cargo package --locked --list > "$RUNNER_TEMP/files.txt"
          ! grep -Ev '^(\.cargo_vcs_info\.json|Cargo\.(toml|toml\.orig|lock)|LICENSE|THIRD-PARTY-NOTICES\.txt|README(\.ja)?\.md|CHANGELOG\.md|SECURITY\.md|askama\.toml|build\.rs|assets/ui\.generated\.css|content/(en|ja)/[0-9][0-9]-[a-z0-9-]+\.md|examples/[a-z_]+\.rs|src/[a-z_/]+\.rs|templates/[a-z_]+\.html)$' "$RUNNER_TEMP/files.txt"
          cargo package --locked

  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Set up Node for the stylesheet and the course
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: The committed stylesheet matches its source
        run: |
          npm ci
          npm run css
          git diff --exit-code -- assets/ui.generated.css
      - name: Build the dependencies once for the tutorial copies
        run: cargo build --locked --all-targets
      - name: Tutorial, English then Japanese
        run: python3 scripts/check_tutorial.py
