name: Pages

# Builds the public site (spec 0006, §6): the static snapshot of `senu site`
# with its canonical addresses, sitemap.xml, robots.txt, llms.txt and the
# Markdown sources. Pull requests only build it; `main` deploys it to
# GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The canonical address of the site: the custom domain configured for
  # GitHub Pages. Change it here and in Cargo.toml's `homepage` together.
  SITE_URL: https://senu.efg-technologies.com/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Save the site as static pages with their public addresses
        run: python3 scripts/snapshot_site.py --base-url "$SITE_URL" "$RUNNER_TEMP/site"
      - name: Upload the pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
