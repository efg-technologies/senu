    - main [ref=e52]:
      - 'heading "Senu: one Rust function as a web page, a JSON API and an MCP tool" [level=1] [ref=e53]'
      - paragraph [ref=e54]: Senu is an open-source Rust library. You declare a read-only function once, with its permission and parameters, and Senu serves it as an HTML page, a JSON API and an MCP tool for AI assistants, with the same authentication order, the same errors and one contract test suite for all three. It is built on Axum, Askama and the official rmcp SDK.
      - heading "Add it to a project" [level=2] [ref=e55]
      - code [ref=e57]: cargo add senu --no-default-features
